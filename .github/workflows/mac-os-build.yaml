name: Miui Theme Editor Build Generation For Mac OS

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - run: flutter --version

      - name: Enable mac os support
        run: flutter config --enable-macos-desktop

      - name: Install project dependencies
        run: flutter pub get

      - name: Generate intermediates
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter Build Release for Mac OS
        run: flutter build macos --release

      - name: Archive Release
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/miui_editor.app build/macos/Build/Products/Release/Miui-Editor-${{ github.ref_name }}-macos.zip

      - name: Mac OS Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: build/macos/Build/Products/Release/Miui-Editor-${{ github.ref_name }}-macos.zip

