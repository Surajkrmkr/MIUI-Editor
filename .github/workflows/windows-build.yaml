name: Miui Theme Editor Build Generation For Windows

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v2
      - uses: subosito/flutter-action@v1
        with:
          channel: "stable"
      - name: Install project dependencies
        run: flutter pub get
      - name: Generate intermediates
        run: flutter pub run build_runner build --delete-conflicting-outputs
      - name: Enable windows support
        run: flutter config --enable-windows-desktop
      - name: Flutter Build Release for Windows
        shell: bash
        run: flutter build windows --release --build-name="${GITHUB_REF_NAME#v}"
      - name: Archive Release
        uses: thedoctor0/zip-release@master
        with:
          type: "zip"
          filename: Miui-Editor-${{github.ref_name}}-windows.zip
          directory: build/windows/x64/runner/Release
      - name: Checksum
        shell: bash
        working-directory: build/windows/x64/runner/Release
        run: sha256sum Miui-Editor-${{github.ref_name}}-windows.zip > Miui-Editor-${{github.ref_name}}-windows.zip.sha256
      - name: Windows Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            build/windows/x64/runner/Release/Miui-Editor-${{github.ref_name}}-windows.zip
            build/windows/x64/runner/Release/Miui-Editor-${{github.ref_name}}-windows.zip.sha256
